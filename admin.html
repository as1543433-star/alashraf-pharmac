<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - صيدلية الأشرف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  :root{ --navy:#16324F; --navy-deep:#0E2438; --gold:#C68B2C; --cream:#F5F3EE; --card:#fff; --ink:#1B2430; --muted:#7C8592; --line:#E7E1D6; --danger:#B23B2E; --success:#2F7D57; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--cream); font-family:'Tajawal',sans-serif; color:var(--ink); }
  h1,h2,h3{ font-family:'Cairo',sans-serif; margin:0; }
  .wrap{ max-width:900px; margin:0 auto; padding:20px 16px 60px; }
  .topbar{ background:var(--navy); color:#fff; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; }
  .topbar h1{ font-size:16px; }
  .topbar button{ background:rgba(255,255,255,0.15); border:none; color:#fff; padding:8px 14px; border-radius:8px; font-family:'Tajawal'; cursor:pointer; font-size:12px; }
  .login-box{ max-width:340px; margin:80px auto; background:var(--card); border-radius:16px; padding:28px; box-shadow:0 8px 24px rgba(0,0,0,0.08); text-align:center; }
  .login-box h2{ margin-bottom:20px; font-size:18px; }
  input, textarea, select{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-family:'Tajawal'; font-size:13px; margin-bottom:10px; background:#fff; color:var(--ink); }
  textarea{ resize:vertical; min-height:60px; }
  label{ font-size:12px; color:var(--muted); display:block; margin-bottom:4px; }
  .btn{ border:none; border-radius:10px; padding:11px 18px; font-family:'Tajawal'; font-weight:700; font-size:13px; cursor:pointer; }
  .btn-primary{ background:var(--navy); color:#fff; width:100%; }
  .btn-gold{ background:var(--gold); color:#fff; }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-outline{ background:#fff; border:1px solid var(--line); color:var(--ink); }
  .tabs{ display:flex; gap:8px; margin:20px 0; overflow-x:auto; }
  .tab-btn{ flex-shrink:0; padding:10px 16px; border-radius:999px; border:1px solid var(--line); background:#fff; font-family:'Tajawal'; font-size:13px; cursor:pointer; }
  .tab-btn.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .tab-content{ display:none; }
  .tab-content.active{ display:block; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card h3{ font-size:14px; margin-bottom:12px; }
  .cat-options{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  .cat-opt{ border:1.5px solid var(--line); border-radius:12px; padding:14px 8px; text-align:center; cursor:pointer; background:#fff; }
  .cat-opt.active{ border-color:var(--gold); background:#FBF1E4; }
  .cat-opt i{ font-size:22px; margin-bottom:6px; display:block; }
  .cat-opt p{ margin:0; font-size:12px; }
  .prod-list-item{ display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); padding:10px 0; }
  .prod-list-item img, .prod-list-item .noimg{ width:44px; height:44px; border-radius:8px; object-fit:cover; background:#eee; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .prod-list-item .info{ flex:1; }
  .prod-list-item .info p{ margin:0; font-size:13px; }
  .prod-list-item .info span{ font-size:11px; color:var(--muted); }
  .prod-actions{ display:flex; gap:6px; }
  .prod-actions button{ padding:6px 10px; font-size:11px; }
  .order-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .order-table th, .order-table td{ text-align:right; padding:8px 6px; border-bottom:1px solid var(--line); }
  .order-status-select{ margin-bottom:0; padding:5px 8px; font-size:11px; }
  .msg{ font-size:12px; margin-top:8px; }
  .msg.err{ color:var(--danger); }
  .msg.ok{ color:var(--success); }
  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,0.4); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal-bg.show{ display:flex; }
  .modal{ background:#fff; border-radius:16px; padding:20px; max-width:420px; width:100%; max-height:85vh; overflow-y:auto; }
  .modal h3{ margin-bottom:14px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
</style>
</head>
<body>

<div id="loginScreen" class="login-box">
  <h2>تسجيل دخول لوحة التحكم</h2>
  <input type="email" id="loginEmail" placeholder="الإيميل">
  <input type="password" id="loginPass" placeholder="الباسورد">
  <button class="btn btn-primary" onclick="doLogin()">دخول</button>
  <p class="msg err" id="loginMsg"></p>
</div>

<div id="dashboard" style="display:none;">
  <div class="topbar">
    <h1>لوحة تحكم صيدلية الأشرف</h1>
    <button onclick="doLogout()">خروج</button>
  </div>
  <div class="wrap">
    <div class="tabs">
      <button class="tab-btn active" data-tab="bannerTab" onclick="switchAdminTab('bannerTab')">البانر</button>
      <button class="tab-btn" data-tab="catsTab" onclick="switchAdminTab('catsTab')">الأقسام</button>
      <button class="tab-btn" data-tab="prodsTab" onclick="switchAdminTab('prodsTab')">المنتجات</button>
      <button class="tab-btn" data-tab="ordersTab" onclick="switchAdminTab('ordersTab')">الطلبات</button>
    </div>

    <div id="bannerTab" class="tab-content active">
      <div class="card">
        <h3>نص البانر الذهبي في الصفحة الرئيسية</h3>
        <label>العنوان الرئيسي</label>
        <input id="bannerTitleInput" placeholder="مثال: خصم 20% على الفيتامينات">
        <label>النص الفرعي</label>
        <input id="bannerSubInput" placeholder="مثال: لحد آخر الشهر">
        <button class="btn btn-gold" onclick="saveBanner()">حفظ</button>
        <p class="msg" id="bannerMsg"></p>
      </div>
    </div>

    <div id="catsTab" class="tab-content">
      <div class="card">
        <h3>اختار الأقسام اللي عايز تظهر في الموقع</h3>
        <div class="cat-options" id="catOptions"></div>
        <p class="msg" id="catsMsg"></p>
      </div>
    </div>

    <div id="prodsTab" class="tab-content">
      <div class="card">
        <button class="btn btn-primary" onclick="openProductModal()">+ إضافة منتج جديد</button>
      </div>
      <div class="card">
        <h3>المنتجات الحالية</h3>
        <div id="prodList"></div>
      </div>
    </div>

    <div id="ordersTab" class="tab-content">
      <div class="card">
        <h3>طلبات جديدة</h3>
        <table class="order-table"><tbody id="ordersNew"></tbody></table>
      </div>
      <div class="card">
        <h3>قيد التنفيذ</h3>
        <table class="order-table"><tbody id="ordersProcessing"></tbody></table>
      </div>
      <div class="card">
        <h3>تم التسليم</h3>
        <table class="order-table"><tbody id="ordersDone"></tbody></table>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="productModalBg">
  <div class="modal">
    <h3 id="modalTitle">إضافة منتج جديد</h3>
    <label>اسم المنتج</label>
    <input id="pName">
    <label>القسم</label>
    <select id="pCategory"></select>
    <div class="row2">
      <div>
        <label>السعر الحالي</label>
        <input id="pPrice" type="number">
      </div>
      <div>
        <label>السعر قبل الخصم (اختياري)</label>
        <input id="pOldPrice" type="number">
      </div>
    </div>
    <label>الوصف (سيب فاضي لو عايز نص تلقائي)</label>
    <textarea id="pDesc"></textarea>
    <label>الجرعة والاستخدام (سيب فاضي هيتحط "حسب إرشادات الصيدلي")</label>
    <textarea id="pUsage"></textarea>
    <label>كلمة التوفر</label>
    <input id="pAvailable" placeholder="متوفر بالمخزون">
    <label>صورة المنتج (اختياري)</label>
    <input id="pImage" type="file" accept="image/*">
    <p class="msg" id="modalMsg"></p>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button class="btn btn-primary" style="flex:1;" onclick="saveProduct()">حفظ</button>
      <button class="btn btn-outline" onclick="closeProductModal()">إلغاء</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCoYdxryBFUNmEv6V_aoUw7pJNhEDoF00Q",
    authDomain: "alashraf-pharmacy.firebaseapp.com",
    projectId: "alashraf-pharmacy",
    storageBucket: "alashraf-pharmacy.firebasestorage.app",
    messagingSenderId: "486283006265",
    appId: "1:486283006265:web:307ed704c57eead2b498e8"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const IMGBB_KEY = "cc8ecfff28c7056a8beb55cbc5299a7d";

  const CATEGORY_OPTIONS = [
    { id:'meds', name:'أدوية', icon:'pill', cls:'d', order:1 },
    { id:'vitamins', name:'فيتامينات', icon:'heart', cls:'b', order:2 },
    { id:'kids', name:'أطفال', icon:'baby-carriage', cls:'c', order:3 },
    { id:'personal', name:'العناية الشخصية', icon:'droplet', cls:'f', order:4 },
    { id:'firstaid', name:'إسعافات أولية', icon:'first-aid-kit', cls:'e', order:5 },
    { id:'mom', name:'الأم والحمل', icon:'heart-handshake', cls:'g', order:6 },
    { id:'beauty', name:'العناية والجمال', icon:'sparkles', cls:'a', order:7 },
  ];

  let activeCategories = [];
  let products = [];
  let editingProductId = null;

  auth.onAuthStateChanged(user => {
    if(user){
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      initDashboard();
    } else {
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
    }
  });

  function doLogin(){
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    auth.signInWithEmailAndPassword(email, pass)
      .catch(e => document.getElementById('loginMsg').textContent = 'بيانات الدخول غلط، حاول تاني');
  }
  function doLogout(){ auth.signOut(); }

  function switchAdminTab(tab){
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
  }

  async function initDashboard(){
    await loadBanner();
    await loadCategories();
    await loadProducts();
    loadOrders();
  }

  async function loadBanner(){
    const doc = await db.collection('settings').doc('banner').get();
    if(doc.exists){
      const d = doc.data();
      document.getElementById('bannerTitleInput').value = d.title || '';
      document.getElementById('bannerSubInput').value = d.subtitle || '';
    }
  }
  async function saveBanner(){
    const title = document.getElementById('bannerTitleInput').value.trim();
    const subtitle = document.getElementById('bannerSubInput').value.trim();
    await db.collection('settings').doc('banner').set({ title, subtitle }, { merge: true });
    document.getElementById('bannerMsg').className = 'msg ok';
    document.getElementById('bannerMsg').textContent = 'تم الحفظ ✓';
    setTimeout(() => document.getElementById('bannerMsg').textContent = '', 2000);
  }

  async function loadCategories(){
    const snap = await db.collection('categories').get();
    activeCategories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderCatOptions();
    renderCategorySelect();
  }
  function renderCatOptions(){
    const wrap = document.getElementById('catOptions');
    wrap.innerHTML = CATEGORY_OPTIONS.map(c => {
      const isActive = activeCategories.some(a => a.id === c.id);
      return `
        <div class="cat-opt ${isActive ? 'active':''}" onclick="toggleCategory('${c.id}')">
          <i class="ti ti-${c.icon}"></i>
          <p>${c.name}</p>
        </div>
      `;
    }).join('');
  }
  async function toggleCategory(id){
    const opt = CATEGORY_OPTIONS.find(c => c.id === id);
    const isActive = activeCategories.some(a => a.id === id);
    if(isActive){
      await db.collection('categories').doc(id).delete();
    } else {
      await db.collection('categories').doc(id).set(opt);
    }
    await loadCategories();
  }
  function renderCategorySelect(){
    const sel = document.getElementById('pCategory');
    sel.innerHTML = activeCategories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  }

  async function loadProducts(){
    const snap = await db.collection('products').orderBy('createdAt','desc').get();
    products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderProdList();
  }
  function renderProdList(){
    const wrap = document.getElementById('prodList');
    if(products.length === 0){ wrap.innerHTML = '<p style="font-size:13px;color:var(--muted);">لا يوجد منتجات بعد</p>'; return; }
    wrap.innerHTML = products.map(p => `
      <div class="prod-list-item">
        ${p.imageUrl ? `<img src="${p.imageUrl}">` : `<div class="noimg"><i class="ti ti-photo"></i></div>`}
        <div class="info">
          <p>${p.name}</p>
          <span>${p.cat} · ${p.price} ج.م${p.oldPrice ? ` (بدل ${p.oldPrice})` : ''}</span>
        </div>
        <div class="prod-actions">
          <button class="btn btn-outline" onclick="editProduct('${p.id}')">تعديل</button>
          <button class="btn btn-danger" onclick="deleteProduct('${p.id}')">حذف</button>
        </div>
      </div>
    `).join('');
  }

  function openProductModal(){
    editingProductId = null;
    document.getElementById('modalTitle').textContent = 'إضافة منتج جديد';
    document.getElementById('pName').value = '';
    document.getElementById('pPrice').value = '';
    document.
