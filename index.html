<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صيدلية الأشرف — تصميم التطبيق</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --page:#DCE6E0; --bg:#F3F6F2; --surface:#FFFFFF; --ink:#12261F; --muted:#5B6E66; --line:#E0E8E2;
  --accent:#0C5B49; --accent-ink:#0C5B49; --on-accent:#FFFFFF; --mint:#DCEFE6; --hero:#0C5B49;
  --coral:#D23F28; --coral-wash:#FDE9E4; --sun:#F7C548; --sun-wash:#FFF3D0; --ring:#0C5B49;
  --shadow:0 1px 2px rgba(18,38,31,.05),0 10px 24px -14px rgba(18,38,31,.22);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#070C0A; --bg:#0D1512; --surface:#16211C; --ink:#EAF3EE; --muted:#95AAA1; --line:#25352E;
    --accent:#14805F; --accent-ink:#6FDCB6; --mint:#173A2F; --hero:#0F5643;
    --coral-wash:#3A1D18; --sun-wash:#3A3115; --ring:#6FDCB6;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --page:#070C0A; --bg:#0D1512; --surface:#16211C; --ink:#EAF3EE; --muted:#95AAA1; --line:#25352E;
  --accent:#14805F; --accent-ink:#6FDCB6; --mint:#173A2F; --hero:#0F5643;
  --coral-wash:#3A1D18; --sun-wash:#3A3115; --ring:#6FDCB6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{
  font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  background:var(--page);color:var(--ink);font-size:15px;line-height:1.55;
  min-height:100dvh;display:grid;place-items:center;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,.num{font-family:'Readex Pro','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:12px}
.muted{color:var(--muted)}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- app shell ---------- */
.app{position:relative;width:100%;max-width:430px;height:100dvh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:520px){
  body{padding:16px}
  .app{height:min(900px,calc(100dvh - 32px));border-radius:42px;border:7px solid #0e1a15;box-shadow:0 40px 90px -40px rgba(0,0,0,.55)}
}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(112px + env(safe-area-inset-bottom));scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

/* ---------- home header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0}
.loc{display:flex;align-items:center;gap:10px}
.loc .pin{width:42px;height:42px;border-radius:14px;background:var(--mint);color:var(--accent-ink);display:grid;place-items:center}
.loc small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.loc b{font-weight:600;font-size:14px}
.round{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.hello{padding:20px 20px 0}
.hello h1{font-size:26px;font-weight:600;line-height:1.3}
.hello p{color:var(--muted);margin-top:2px}
.search{margin:16px 20px 0;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0 16px;height:54px;box-shadow:var(--shadow);color:var(--muted)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 22%,transparent)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search .clr{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}

/* ---------- prescription hero ---------- */
.rx{margin:18px 20px 0;border-radius:28px;background:var(--hero);color:#fff;padding:22px 20px 18px;position:relative;overflow:hidden;display:grid;gap:14px}
.rx h2{font-size:23px;font-weight:600;line-height:1.3}
.rx p{color:rgba(255,255,255,.85);font-size:14px;max-width:215px}
.rx .art{position:absolute;inset-inline-end:-10px;top:10px;width:138px;height:auto}
.btn-sun{background:var(--sun);color:#16261f;font-weight:600;height:48px;border-radius:16px;padding:0 18px;display:inline-flex;align-items:center;gap:8px;justify-self:start;position:relative}
.rx .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:rgba(255,255,255,.85)}
.rx .meta span{display:flex;align-items:center;gap:6px}
.rx .meta .i{width:17px;height:17px}

/* ---------- offers ---------- */
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding-inline:20px}
.hs::-webkit-scrollbar{display:none}
.offers{padding-top:18px}
.offer{flex:0 0 76%;scroll-snap-align:start;border-radius:22px;padding:16px;display:flex;gap:12px;align-items:center;text-align:start;border:1px solid transparent}
.offer .oi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.55);color:#16261f}
.offer b{display:block;font-weight:600;font-size:15px;line-height:1.35}
.offer small{color:inherit;opacity:.8;font-size:13px}
.offer.sun{background:var(--sun-wash);color:var(--ink);border-color:color-mix(in srgb,var(--sun) 50%,transparent)}
.offer.mint{background:var(--mint);color:var(--ink)}
.offer.coral{background:var(--coral-wash);color:var(--ink)}
.offer.mint .oi,.offer.coral .oi{background:var(--surface);color:var(--accent-ink)}
.offer.coral .oi{color:var(--coral)}

/* ---------- sections, categories ---------- */
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:26px 20px 12px}
.sec h2{font-size:20px;font-weight:600}
.sec span{font-size:13px}
.cats{padding-bottom:4px}
.cat{flex:0 0 auto;min-width:78px;padding:12px 8px 10px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);display:grid;justify-items:center;gap:8px;font-size:13px;font-weight:500}
.cat .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--mint);font-weight:600}

/* ---------- product cards ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0}
.tile{position:relative;border-radius:16px;aspect-ratio:1/.92;background:var(--mint);background:color-mix(in srgb,var(--c) 14%,var(--surface));display:grid;place-items:center;overflow:hidden}
.tile .art{width:72%;height:auto;display:block}
.tile .open{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px}
.badge{position:absolute;top:8px;inset-inline-start:8px;background:var(--coral);color:#fff;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;pointer-events:none}
.badge.rxt{background:var(--ink);color:var(--bg)}
.fav{position:absolute;top:4px;inset-inline-end:4px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.fav .i{width:20px;height:20px}
.fav[aria-pressed="true"]{color:var(--coral)}
.fav[aria-pressed="true"] .i{fill:currentColor}
.nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:start;font-weight:600;font-size:14.5px;line-height:1.4;margin:10px 6px 0;min-height:2.8em}
.pk{color:var(--muted);font-size:12.5px;margin:2px 6px 0}
.buy{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin:10px 6px 6px}
.price b{font-family:'Readex Pro',sans-serif;font-size:16px;font-weight:600;display:block;line-height:1.3}
.price s{color:var(--muted);font-size:12.5px}
.add{width:42px;height:42px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.step{display:inline-flex;align-items:center;background:var(--mint);color:var(--accent-ink);border-radius:14px;height:42px}
.step button{width:32px;height:42px;display:grid;place-items:center}
.step .i{width:18px;height:18px}
.step b{min-width:20px;text-align:center;font-family:'Readex Pro',sans-serif;font-weight:600}
.step.lg{height:56px;border-radius:18px}
.step.lg button{width:46px;height:56px}
.step.lg b{min-width:26px;font-size:17px}
.empty{grid-column:1/-1;text-align:center;padding:36px 12px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:17px;margin-bottom:4px}

/* ---------- bottom nav ---------- */
.nav{position:absolute;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom));height:68px;background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:0 12px 32px -12px rgba(0,0,0,.3);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;z-index:5}
.nav button{position:relative;border-radius:20px;display:grid;justify-items:center;align-content:center;gap:2px;font-size:11.5px;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--mint);color:var(--accent-ink);font-weight:600}
.nav .cnt{position:absolute;top:5px;left:calc(50% + 4px);min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px;font-family:'Readex Pro',sans-serif}

/* ---------- page headings for tabs ---------- */
.ph1{padding:22px 20px 4px}
.ph1 h1{font-size:26px;font-weight:600}
.ph1 p{color:var(--muted)}

/* ---------- categories tab ---------- */
.crows{display:grid;gap:10px;padding:14px 20px 0}
.crow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 14px;text-align:start}
.crow .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.crow b{display:block;font-weight:600}
.crow small{color:var(--muted)}
.crow>span:nth-child(2){flex:1}
.crow .i.go{color:var(--muted)}

/* ---------- cart ---------- */
.lines{display:grid;gap:10px;padding:14px 20px 0}
.line{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px}
.line .tile{aspect-ratio:1;border-radius:14px}
.line .tile .art{width:80%}
.line b.n{font-weight:600;font-size:14.5px;line-height:1.4;display:block}
.line .num{font-size:14px;color:var(--muted)}
.line .rxok{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--accent-ink);background:var(--mint);border-radius:999px;padding:1px 8px;margin-top:4px}
.line .rxok .i{width:13px;height:13px}
.line .side{display:grid;gap:6px;justify-items:end}
.line .del{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ship{margin:14px 20px 0;padding:14px 16px;background:var(--sun-wash);border-radius:18px;font-size:14px}
.ship b{font-weight:600}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--sun) 35%,transparent);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:inherit;transition:width .3s}
.box{margin:14px 20px 0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.box h3{font-size:15px;font-weight:600;margin-bottom:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{height:48px;border-radius:14px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--mint);color:var(--accent-ink);font-weight:600}
.addr{display:flex;align-items:center;gap:12px}
.addr .pin{width:42px;height:42px;border-radius:14px;background:var(--mint);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.rowl{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted)}
.rowl b{color:var(--ink);font-weight:500}
.rowl.tot{border-top:1px dashed var(--line);margin-top:8px;padding-top:12px;color:var(--ink);font-weight:600;font-size:17px}
.rowl.tot b{font-weight:700}
.cta{display:flex;align-items:center;justify-content:space-between;width:100%;height:56px;border-radius:18px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;padding:0 22px}
.cta:disabled{opacity:.45;cursor:not-allowed}
.cta.solo{justify-content:center}
.ctaw{padding:14px 20px 0}
.zero{display:grid;justify-items:center;text-align:center;gap:8px;padding:64px 32px 0}
.zero svg{width:120px;height:auto}
.zero h2{font-size:20px;font-weight:600}
.zero .btn{margin-top:10px}
.btn{height:48px;border-radius:16px;background:var(--accent);color:var(--on-accent);padding:0 22px;font-weight:600;display:inline-flex;align-items:center;gap:8px}

/* ---------- account ---------- */
.me{display:flex;align-items:center;gap:14px;padding:22px 20px 0}
.av{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:'Readex Pro',sans-serif;font-size:24px;font-weight:600}
.me h1{font-size:22px;font-weight:600}
.pts{margin:16px 20px 0;padding:16px;background:var(--mint);border-radius:22px}
.pts .num{font-size:30px;font-weight:600;line-height:1.2}
.pts p{font-size:13.5px;color:var(--muted)}
.order{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:8px}
.order .h{display:flex;justify-content:space-between;align-items:baseline}
.order .h b{font-weight:600}
.order .h span{font-size:13px;color:var(--muted)}
.order .it{font-size:14px;color:var(--muted)}
.order .f{display:flex;justify-content:space-between;align-items:center}
.order .f .num{font-weight:600}
.mini{height:40px;border-radius:12px;padding:0 14px;background:var(--mint);color:var(--accent-ink);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.mini .i{width:18px;height:18px}
.rows{margin:20px 20px 0;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.rows button{display:flex;align-items:center;gap:12px;width:100%;padding:16px;text-align:start}
.rows button+button{border-top:1px solid var(--line)}
.rows button>span:nth-child(2){flex:1}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:inset-inline-start .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[data-on="1"]{background:var(--accent)}
.sw[data-on="1"]::after{inset-inline-start:23px}

/* ---------- sheet ---------- */
.wrap{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;background:rgba(6,16,12,.55);opacity:0;transition:opacity .2s}
.wrap.open{opacity:1}
.sheet{position:relative;width:100%;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(28px);transition:transform .25s ease;outline:none}
.wrap.open .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.x{position:absolute;top:14px;inset-inline-start:14px;width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;z-index:2}
.tile.big{aspect-ratio:1/.66;border-radius:24px;margin-top:6px}
.tile.big .art{width:44%}
.pr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:16px}
.pr h2{font-size:22px;font-weight:600;line-height:1.35}
.pr .fav{position:static;background:var(--surface);border:1px solid var(--line);flex:none}
.pp{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.pp b{font-family:'Readex Pro',sans-serif;font-size:26px;font-weight:600;color:var(--accent-ink)}
.pp s{color:var(--muted)}
.desc{margin-top:10px;color:var(--muted)}
.facts{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.facts li{display:flex;align-items:center;gap:12px;font-size:14px}
.facts .fi{width:38px;height:38px;border-radius:12px;background:var(--mint);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.facts .fi .i{width:19px;height:19px}
.note{margin-top:16px;padding:14px;border-radius:18px;background:var(--sun-wash);font-size:14px;display:flex;gap:12px}
.note .i{color:var(--ink);margin-top:2px}
.foot{display:flex;gap:12px;margin-top:20px}
.foot .cta{flex:1}
.drop{position:relative;display:grid;justify-items:center;gap:6px;text-align:center;margin-top:16px;padding:26px 16px;border:2px dashed color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:22px;background:var(--surface);cursor:pointer}
.drop:focus-within{outline:3px solid var(--ring);outline-offset:2px}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.drop .i{width:32px;height:32px;color:var(--accent-ink)}
.drop small{color:var(--muted)}
.drop img{width:100%;max-height:180px;object-fit:cover;border-radius:14px}
.done{display:grid;justify-items:center;text-align:center;gap:8px;padding:22px 0 4px}
.done .ok{width:76px;height:76px;border-radius:50%;background:var(--mint);color:var(--accent-ink);display:grid;place-items:center}
.done .ok .i{width:38px;height:38px;stroke-width:2.2}
.done h2{font-size:22px;font-weight:600}
.done .chip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-family:'Readex Pro',sans-serif;font-weight:500}

/* ---------- toast ---------- */
.toast{position:absolute;bottom:calc(96px + env(safe-area-inset-bottom));inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 40px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;z-index:30;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.1a1 1 0 0 0 1-.8L21 7H6"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

<script>
(() => {
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const fmt = n => Number(n).toLocaleString('ar-EG');
const egp = n => fmt(n) + ' ج.م';
const ic = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const store = {
  get(k, d) { try { const v = localStorage.getItem('ashraf:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ashraf:' + k, JSON.stringify(v)); } catch (e) {} }
};

const FEE = 25, FREE = 300;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const CATS = [
  { id: 'all',  n: 'الكل',      i: 'grid',    c: '#4B6B90' },
  { id: 'meds', n: 'أدوية',     i: 'pill',    c: '#2F9E6E' },

  { id: 'care', n: 'عناية',     i: 'sparkle', c: '#7A56C2' },
  { id: 'dev',  n: 'أجهزة',     i: 'pulse',   c: '#2D86C9' }
];
const catName = id => CATS.find(c => c.id === id).n;

const P = [
  { id: 1,  n: 'بنادول إكسترا',          cat: 'meds', pack: '٢٤ قرص',            price: 50,  old: 55,  t: 'box',    c: '#D9412F', d: 'مسكّن للصداع وآلام الجسم وخافض للحرارة. التزم بالجرعة المكتوبة في النشرة الداخلية.' },
  { id: 2,  n: 'شامبو مضاد للقشرة',      cat: 'care', pack: '٢٠٠ مل',            price: 65,           t: 'bottle', m: 'drop', c: '#1F8F7A', d: 'تركيبة لطيفة بتقلل القشور وبتهدّي فروة الرأس من أول استخدام.' },
  { id: 3,  n: 'أوميجا ٣',               cat: 'vit',  pack: '٣٠ كبسولة',         price: 120, old: 126, t: 'jar',    c: '#C98A12', d: 'زيت سمك نقي لدعم القلب والتركيز. كبسولة واحدة يومياً مع الأكل.' },
  { id: 4,  n: 'حليب أطفال ١',           cat: 'baby', pack: '٤٠٠ جم، من الولادة', price: 210,          t: 'can',    c: '#3E7CB1', d: 'تركيبة للرضّع من الولادة لحد ٦ شهور. حضّره حسب التعليمات على العلبة.' },
  { id: 5,  n: 'فيتامين د٣ ٥٠٠٠',        cat: 'vit',  pack: '٦٠ كبسولة',         price: 95,  old: 100, t: 'jar',    c: '#E0A100', d: 'جرعة عالية لتعويض نقص فيتامين د. اسأل الصيدلي عن الجرعة المناسبة ليك.' },
  { id: 6,  n: 'شراب كحة للأطفال',       cat: 'baby', pack: '١٠٠ مل',            price: 48,           t: 'bottle', m: 'plus', c: '#7A56C2', d: 'شراب بطعم الفراولة بيهدّي الكحة الجافة عند الأطفال. مع كل علبة كوب قياس.' },
  { id: 7,  n: 'كريم مرطب للبشرة',       cat: 'care', pack: '٥٠ جم',             price: 95,           t: 'tube',   m: 'drop', c: '#2FA36B', d: 'ترطيب يدوم ٢٤ ساعة للبشرة الجافة والحساسة، من غير عطور.' },
  { id: 8,  n: 'جهاز قياس الضغط',        cat: 'dev',  pack: 'رقمي للذراع',        price: 890, old: 950, t: 'device', c: '#2F4A5A', d: 'شاشة كبيرة وواضحة، بيحفظ آخر ٩٠ قراءة، وبينبّهك لو النبض مش منتظم.' },
  { id: 9,  n: 'مضاد حيوي ٥٠٠ مجم',      cat: 'meds', pack: '١٤ كبسولة',         price: 72,           t: 'box',    c: '#0C5B49', rx: true, d: 'مضاد حيوي واسع المدى. بيتصرف بروشتة طبية، وبيتاخد كامل المدة اللي حددها الطبيب.' },
  { id: 10, n: 'بخاخ محلول ملحي للأنف',  cat: 'meds', pack: '٣٠ مل',             price: 38,           t: 'spray',  c: '#2D86C9', d: 'بينضّف الأنف ويخفف الاحتقان من غير أدوية. مناسب للكبار والأطفال.' },
  { id: 11, n: 'حفاضات مقاس ٣',          cat: 'baby', pack: '٥٤ حفاضة',          price: 175,          t: 'bag',    c: '#E0708A', d: 'طبقة امتصاص سريعة وبطانة ناعمة، مناسبة لوزن من ٦ لـ ١٠ كجم.' },
  { id: 12, n: 'واقي شمس SPF 50',        cat: 'care', pack: '٦٠ مل',             price: 140, old: 165, t: 'tube',   m: 'plus', c: '#F08A24', d: 'حماية عالية من UVA وUVB، قوامه خفيف وما بيسيبش أثر أبيض.' },
  { id: 13, n: 'بروبيوتيك ١٠ مليار',     cat: 'vit',  pack: '٣٠ كبسولة',         price: 190, old: 200, t: 'jar',    m: 'plus', c: '#2E9C8C', d: 'بكتيريا نافعة لدعم الهضم والمناعة. بتتاخد على الريق.' },
  { id: 14, n: 'كمامات طبية',            cat: 'dev',  pack: '٥٠ قطعة',           price: 60,           t: 'box',    c: '#3C8DBC', d: 'ثلاث طبقات بفلتر، مريحة على الأذن وبتسمح بالتنفس.' }
];
const byId = Object.fromEntries(P.map(p => [p.id, p]));

const OFFERS = [
  { k: 'sun',   i: 'pill',  t: 'خصم ٥٪ على الفيتامينات', s: 'لحد آخر الشهر',              go: 'cat:vit' },
  { k: 'mint',  i: 'truck', t: 'توصيل مجاني',            s: 'لأي طلب فوق ' + egp(FREE),  go: 'tab:cart' },
  { k: 'coral', i: 'star',  t: 'نقاط الأشرف',            s: 'كل ١٠ ج.م بنقطة',           go: 'tab:me' }
];

const DEMO_ORDERS = [
  { no: 'AS-4790', date: '١٢ سبتمبر', items: [[1, 2], [3, 1]] },
  { no: 'AS-4713', date: '٢ سبتمبر',  items: [[10, 1], [7, 1]] }
];

/* ---------- state ---------- */
const state = {
  tab: 'home', cat: 'all', q: '', pay: 'cash',
  cart: store.get('cart', {}),
  favs: store.get('favs', []),
  rxOk: store.get('rx', []),
  orders: store.get('orders', DEMO_ORDERS),
  pts: store.get('pts', 420)
};
const save = () => {
  store.set('cart', state.cart); store.set('favs', state.favs);
  store.set('rx', state.rxOk); store.set('orders', state.orders); store.set('pts', state.pts);
};

/* ---------- product illustrations (inline vector, no remote images) ---------- */
function baby(x, y, c) {
  return `<circle cx="${x}" cy="${y}" r="11" fill="${c}"/><circle cx="${x - 4}" cy="${y - 3}" r="1.8" fill="#fff"/><circle cx="${x + 4}" cy="${y - 3}" r="1.8" fill="#fff"/><path d="M${x - 5} ${y + 3}q5 4.5 10 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>`;
}
function mark(kind, c, x, y) {
  if (kind === 'drop') return `<path d="M${x} ${y - 7}c4 5 6.5 8 6.5 11.5a6.5 6.5 0 0 1-13 0c0-3.5 2.5-6.500 6.500-11.500z" fill="${c}"/>`;
  return `<path d="M${x} ${y - 8}v16M${x - 8} ${y}h16" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`;
}
function art(p) {
  const c = p.c, m = p.m || 'plus';
  const shapes = {
    box: `<path d="M22 28l10-8h76l-10 8z" fill="#fff" opacity=".35"/><path d="M98 28l10-8v68l-10 8z" fill="#000" opacity=".2"/><rect x="22" y="28" width="76" height="68" rx="4" fill="${c}"/><rect x="22" y="54" width="76" height="26" fill="#fff" opacity=".95"/>${mark('plus', c, 60, 67)}<rect x="30" y="36" width="34" height="5" rx="2.5" fill="#fff" opacity=".7"/><rect x="30" y="86" width="24" height="4" rx="2" fill="#fff" opacity=".5"/>`,
    bottle: `<rect x="50" y="10" width="20" height="14" rx="3" fill="#26352f"/><rect x="45" y="22" width="30" height="10" rx="3" fill="${c}" opacity=".85"/><rect x="32" y="30" width="56" height="76" rx="16" fill="${c}"/><rect x="32" y="56" width="56" height="34" fill="#fff" opacity=".95"/>${mark(m, c, 60, 73)}<rect x="39" y="38" width="8" height="14" rx="4" fill="#fff" opacity=".28"/>`,
    jar: `<rect x="30" y="14" width="60" height="18" rx="5" fill="#26352f"/><rect x="26" y="30" width="68" height="76" rx="14" fill="${c}"/><rect x="26" y="54" width="68" height="34" fill="#fff" opacity=".95"/>${mark(m, c, 60, 71)}<rect x="33" y="38" width="8" height="10" rx="4" fill="#fff" opacity=".3"/>`,
    tube: `<g transform="rotate(-28 60 60)"><rect x="49" y="8" width="22" height="14" rx="3" fill="#26352f"/><path d="M48 22h24l10 70H38z" fill="${c}"/><path d="M45 42h30l3 26H42z" fill="#fff" opacity=".95"/>${mark(m, c, 60, 55)}<rect x="38" y="92" width="44" height="8" rx="2" fill="${c}"/><rect x="38" y="92" width="44" height="8" rx="2" fill="#000" opacity=".22"/></g>`,
    can: `<rect x="34" y="12" width="52" height="11" rx="4" fill="#DDE5E0"/><rect x="30" y="21" width="60" height="86" rx="10" fill="${c}"/><rect x="30" y="46" width="60" height="40" fill="#fff" opacity=".95"/>${baby(60, 66, c)}<rect x="37" y="28" width="8" height="12" rx="4" fill="#fff" opacity=".3"/>`,
    device: `<rect x="16" y="26" width="88" height="70" rx="15" fill="${c}"/><rect x="27" y="36" width="66" height="32" rx="8" fill="#0d1a15"/><text x="60" y="60" text-anchor="middle" font-size="19" font-weight="600" fill="#7CF0C4" font-family="Readex Pro, Segoe UI, sans-serif">120/80</text><circle cx="44" cy="82" r="6" fill="#fff" opacity=".92"/><circle cx="76" cy="82" r="6" fill="#fff" opacity=".55"/>`,
    spray: `<rect x="50" y="8" width="20" height="12" rx="3" fill="#26352f"/><rect x="54" y="18" width="12" height="12" fill="#CBD6D0"/><rect x="36" y="28" width="48" height="78" rx="14" fill="${c}"/><rect x="36" y="54" width="48" height="34" fill="#fff" opacity=".95"/>${mark('drop', c, 60, 70)}`,
    bag: `<path d="M26 32q34-14 68 0l6 68q-40 10-80 0z" fill="${c}"/><path d="M23 56q37 10 74 0l1.500 24q-38.500 9-77 0z" fill="#fff" opacity=".95"/>${baby(60, 66, c)}`
  };
  return `<svg class="art" viewBox="0 0 120 120" aria-hidden="true"><ellipse cx="60" cy="110" rx="32" ry="4.5" fill="#000" opacity=".12"/>${shapes[p.t]}</svg>`;
}

/* ---------- helpers ---------- */
const norm = s => String(s).toLowerCase()
  .replace(/[\u064B-\u065F\u0670]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
  .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const cartCount = () => Object.values(state.cart).reduce((a, b) => a + b, 0);
const subtotal = () => Object.entries(state.cart).reduce((a, [id, q]) => a + byId[id].price * q, 0);
const feeFor = sub => (sub >= FREE || sub === 0 ? 0 : FEE);
const orderSub = o => o.items.reduce((a, [id, q]) => a + byId[id].price * q, 0);
const disc = p => p.old ? Math.round((p.old - p.price) / p.old * 100) : 0;
const isFav = id => state.favs.includes(id);

let toastT;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

function stepper(id, q, lg) {
  return `<div class="step${lg ? ' lg' : ''}" role="group" aria-label="الكمية">
    <button data-act="${lg ? 'sdec' : 'dec'}" data-id="${id}" aria-label="قلّل الكمية">${ic('minus')}</button>
    <b>${fmt(q)}</b>
    <button data-act="${lg ? 'sinc' : 'inc'}" data-id="${id}" aria-label="زوّد الكمية">${ic('plus')}</button>
  </div>`;
}

function card(p) {
  const q = state.cart[p.id] || 0, d = disc(p);
  return `<article class="card">
    <div class="tile" style="--c:${p.c}">
      <button class="open" data-act="open" data-id="${p.id}" aria-label="تفاصيل ${p.n}">${art(p)}</button>
      ${d ? `<span class="badge">خصم ${fmt(d)}٪</span>` : ''}${p.rx ? `<span class="badge rxt">بروشتة</span>` : ''}
      <button class="fav" data-act="fav" data-id="${p.id}" aria-pressed="${isFav(p.id)}" aria-label="المفضلة">${ic('heart')}</button>
    </div>
    <button class="nm" data-act="open" data-id="${p.id}">${p.n}</button>
    <div class="pk">${p.pack}</div>
    <div class="buy">
      <div class="price"><b>${egp(p.price)}</b>${p.old ? `<s>${egp(p.old)}</s>` : ''}</div>
      ${q ? stepper(p.id, q) : `<button class="add" data-act="add" data-id="${p.id}" aria-label="أضف ${p.n} للسلة">${ic('plus')}</button>`}
    </div>
  </article>`;
}

/* ---------- renderers ---------- */
function renderStatic() {
  $('#offers').innerHTML = OFFERS.map(o => `<button class="offer ${o.k}" data-act="offer" data-go="${o.go}">
    <span class="oi">${ic(o.i)}</span><span><b>${o.t}</b><small>${o.s}</small></span></button>`).join('');
  $('#crows').innerHTML = CATS.filter(c => c.id !== 'all').map(c => {
    const n = P.filter(p => p.cat === c.id).length;
    return `<button class="crow" data-act="cat" data-id="${c.id}" data-jump="1">
      <span class="ic" style="--c:${c.c}">${ic(c.i)}</span>
      <span><b>${c.n}</b><small>${fmt(n)} منتج</small></span>
      <svg class="i go" aria-hidden="true"><use href="#i-chev"/></svg></button>`;
  }).join('');
}
function renderCats() {
  $('#cats').innerHTML = CATS.map(c => `<button class="cat" data-act="cat" data-id="${c.id}" aria-pressed="${state.cat === c.id}">
    <span class="ic" style="--c:${c.c}">${ic(c.i)}</span>${c.n}</button>`).join('');
}
function filtered() {
  const q = norm(state.q.trim());
  return P.filter(p => (state.cat === 'all' || p.cat === state.cat) && (!q || norm(p.n + ' ' + catName(p.cat)).includes(q)));
}
function renderGrid() {
  const list = filtered(), q = state.q.trim();
  const title = $('#gridTitle');
  title.textContent = q ? 'نتائج البحث' : state.cat === 'all' ? 'الأكثر طلباً' : catName(state.cat);
  $('#gridCount').textContent = fmt(list.length) + ' منتج';
  const g = $('#grid');
  if (!list.length) {
    g.innerHTML = `<div class="empty"><h3>مفيش نتيجة</h3><p>جرّب اسم تاني، أو صوّر الروشتة والصيدلي يدوّر لك.</p></div>`;
    return;
  }
  g.innerHTML = list.map(card).join('');
}
function renderBadge() {
  const n = cartCount(), b = $('#cnt');
  b.hidden = !n; b.textContent = fmt(n);
}
function renderCart() {
  const el = $('#tab-cart');
  const items = Object.entries(state.cart).map(([id, q]) => ({ p: byId[id], q }));
  if (!items.length) {
    el.innerHTML = `<div class="zero">
      <svg viewBox="0 0 120 100" aria-hidden="true"><circle cx="60" cy="50" r="42" fill="var(--mint)"/><path d="M36 34h9l6 26h30l6-20H47" fill="none" stroke="var(--accent-ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="55" cy="72" r="4" fill="var(--accent-ink)"/><circle cx="77" cy="72" r="4" fill="var(--accent-ink)"/></svg>
      <h2>السلة فاضية</h2><p class="muted">ابدأ من الأقسام، أو ابعت روشتة والصيدلي يجهّزها.</p>
      <button class="btn" data-act="tab" data-tab="home">${ic('home')}تصفّح المنتجات</button></div>`;
    return;
  }
  const sub = subtotal(), fee = feeFor(sub), total = sub + fee;
  const left = Math.max(0, FREE - sub), pct = Math.min(100, Math.round(sub / FREE * 100));
  el.innerHTML = `
    <div class="ph1"><h1>السلة</h1><p>${fmt(cartCount())} منتج</p></div>
    <div class="lines">${items.map(({ p, q }) => `
      <div class="line">
        <div class="tile" style="--c:${p.c}">${art(p)}</div>
        <div><b class="n">${p.n}</b><span class="num">${egp(p.price)}</span>
          ${p.rx ? `<div class="rxok">${ic('check')}تم رفع الروشتة</div>` : ''}</div>
        <div class="side">${stepper(p.id, q)}<button class="del" data-act="del" data-id="${p.id}" aria-label="احذف ${p.n}">${ic('trash')}</button></div>
      </div>`).join('')}</div>
    <div class="ship">${left ? `فاضل <b>${egp(left)}</b> ويبقى التوصيل مجاني` : `<b>التوصيل مجاني</b> على طلبك ده`}
      <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div></div>
    <div class="box"><h3>العنوان</h3>
      <div class="addr"><span class="pin">${ic('pin')}</span><div><b>البيت</b><div class="muted">مدينة نصر، القاهرة</div></div></div></div>
    <div class="box"><h3>طريقة الدفع</h3>
      <div class="seg">
        <button data-act="pay" data-v="cash" aria-pressed="${state.pay === 'cash'}">${ic('cash')}كاش عند الاستلام</button>
        <button data-act="pay" data-v="card" aria-pressed="${state.pay === 'card'}">${ic('card')}كارت</button>
      </div></div>
    <div class="box">
      <div class="rowl"><span>المجموع</span><b class="num">${egp(sub)}</b></div>
      <div class="rowl"><span>التوصيل</span><b class="num">${fee ? egp(fee) : 'مجاني'}</b></div>
      <div class="rowl tot"><span>الإجمالي</span><b class="num">${egp(total)}</b></div></div>
    <div class="ctaw"><button class="cta" data-act="checkout"><span>أكّد الطلب</span><span class="num">${egp(total)}</span></button></div>`;
}
function renderMe() {
  const el = $('#tab-me');
  const favs = state.favs.map(id => byId[id]).filter(Boolean);
  const dark = isDark();
  el.innerHTML = `
    <div class="me"><div class="av" aria-hidden="true">ع</div><div><h1>عبدالرحمن</h1><p class="muted">حسابي في صيدلية الأشرف</p></div></div>
    <div class="pts"><p>رصيد نقاطك</p><div class="num">${fmt(state.pts)} نقطة</div><p>كل ١٠ نقاط بجنيه خصم في الطلبات الجاية.</p></div>
    <div class="sec"><h2>طلباتي</h2></div>
    <div class="lines" style="padding-top:0">${state.orders.length ? state.orders.map(o => {
      const sub = orderSub(o), tot = sub + feeFor(sub);
      return `<div class="order">
        <div class="h"><b>طلب ${o.no}</b><span>${o.date}</span></div>
        <div class="it">${o.items.map(([id, q]) => byId[id].n + (q > 1 ? ' ×' + fmt(q) : '')).join('، ')}</div>
        <div class="f"><span class="num">${egp(tot)}</span><button class="mini" data-act="reorder" data-no="${o.no}">${ic('repeat')}اطلب تاني</button></div>
      </div>`; }).join('') : `<p class="muted">لسه ما طلبتش حاجة.</p>`}</div>
    <div class="sec"><h2>المفضلة</h2></div>
    ${favs.length ? `<div class="grid">${favs.map(card).join('')}</div>` : `<p class="muted" style="padding:0 20px">اضغط على القلب في أي منتج وهيظهر هنا.</p>`}
    <div class="rows">
      <button data-act="theme"><span class="fi-i">${ic('moon')}</span><span>الوضع الليلي</span><span class="sw" data-on="${dark ? 1 : 0}" role="switch" aria-checked="${dark}"></span></button>
      <button data-act="help"><span class="fi-i">${ic('help')}</span><span>كلّم الصيدلي</span>${ic('chev')}</button>
    </div>`;
}
function isDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}

/* ---------- state changes ---------- */
function setQty(id, q) {
  if (q <= 0) delete state.cart[id]; else state.cart[id] = Math.min(q, 10);
  save(); refresh();
}
function refresh() {
  renderBadge(); renderGrid();
  if (state.tab === 'cart') renderCart();
  if (state.tab === 'me') renderMe();
}
function go(tab) {
  state.tab = tab;
  ['home', 'cats', 'cart', 'me'].forEach(t => { $('#tab-' + t).hidden = t !== tab; });
  document.querySelectorAll('.nav button').forEach(b => {
    if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (tab === 'cart') renderCart();
  if (tab === 'me') renderMe();
  $('#screen').scrollTo({ top: 0 });
}
function setCat(id, jump) {
  state.cat = id; state.q = ''; $('#q').value = ''; $('#qclr').hidden = true;
  renderCats(); renderGrid();
  if (jump) { go('home'); $('#gridTitle').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }
}

/* ---------- sheet ---------- */
let sheetId = null, sheetQty = 1, rxFor = null;
function openSheet(html) {
  const w = $('#wrap'), s = $('#sheet');
  s.innerHTML = html;
  if (w.hidden) { w.hidden = false; requestAnimationFrame(() => w.classList.add('open')); }
  s.scrollTop = 0; s.focus({ preventScroll: true });
}
function closeSheet() {
  const w = $('#wrap');
  if (w.hidden) return;
  w.classList.remove('open');
  setTimeout(() => { w.hidden = true; $('#sheet').innerHTML = ''; }, reduce ? 0 : 220);
}
const closeBtn = `<button class="x" data-act="close" aria-label="إغلاق">${ic('x')}</button>`;

function openProduct(id) {
  const p = byId[id]; sheetId = id; sheetQty = state.cart[id] || 1;
  const d = disc(p), needRx = p.rx && !state.rxOk.includes(id);
  openSheet(`<div class="grab"></div>${closeBtn}
    <div class="tile big" style="--c:${p.c}">${art(p)}${d ? `<span class="badge">خصم ${fmt(d)}٪</span>` : ''}${p.rx ? `<span class="badge rxt">بروشتة</span>` : ''}</div>
    <div class="pr"><div><h2>${p.n}</h2><p class="muted">${catName(p.cat)}، ${p.pack}</p></div>
      <button class="fav" data-act="fav" data-id="${id}" aria-pressed="${isFav(id)}" aria-label="المفضلة">${ic('heart')}</button></div>
    <div class="pp"><b>${egp(p.price)}</b>${p.old ? `<s>${egp(p.old)}</s>` : ''}</div>
    <p class="desc">${p.d}</p>
    <ul class="facts">
      <li><span class="fi">${ic('shield')}</span>منتج أصلي ١٠٠٪</li>
      <li><span class="fi">${ic('truck')}</span>توصيل خلال ٣٠ دقيقة</li>
      <li><span class="fi">${ic('help')}</span>صيدلي جاهز يرد على أسئلتك</li>
    </ul>
    ${needRx ? `<div class="note">${ic('file')}<p>الدواء ده بيتصرف بروشتة طبية. ارفع صورة واضحة والصيدلي هيراجعها قبل التجهيز.</p></div>` : ''}
    <div class="foot">${needRx
      ? `<button class="cta solo" data-act="rx" data-id="${id}">ارفع الروشتة</button>`
      : `${stepper(id, sheetQty, true)}<button class="cta" data-act="sadd"><span>${state.cart[id] ? 'حدّث السلة' : 'أضف للسلة'}</span><span class="num" id="sTot">${egp(p.price * sheetQty)}</span></button>`}
    </div>`);
}
function updateSheetQty() {
  const b = $('#sheet .step.lg b'); if (b) b.textContent = fmt(sheetQty);
  const t = $('#sTot'); if (t) t.textContent = egp(byId[sheetId].price * sheetQty);
}
function openRx(forId) {
  rxFor = forId || null;
  openSheet(`<div class="grab"></div>${closeBtn}
    <h2 style="font-size:22px;font-weight:600;padding-top:34px">ارفع الروشتة</h2>
    <p class="muted" style="margin-top:6px">${rxFor ? `«${byId[rxFor].n}» لازم روشتة. ` : ''}صوّرها كاملة وفي إضاءة كويسة، والصيدلي هيراجعها ويكلّمك لو محتاج حاجة.</p>
    <label class="drop"><input type="file" id="rxFile" accept="image/*" capture="environment">
      <span id="dropIn" style="display:grid;justify-items:center;gap:6px;width:100%">${ic('camera')}<b>اضغط لتصوير الروشتة أو اختيار صورة</b><small>صورة واضحة، أقصى حجم ١٠ ميجا</small></span></label>
    <ul class="facts">
      <li><span class="fi">${ic('shield')}</span>الصيدلي المرخّص بيراجعها قبل التجهيز</li>
      <li><span class="fi">${ic('clock')}</span>الرد خلال ١٠ دقايق</li>
    </ul>
    <div class="foot"><button class="cta solo" id="rxGo" data-act="rxsend" disabled>أرسل للصيدلي</button></div>`);
}

/* ---------- actions ---------- */
document.addEventListener('change', e => {
  if (e.target.id !== 'rxFile') return;
  const f = e.target.files && e.target.files[0], go = $('#rxGo'), box = $('#dropIn');
  if (!f) return;
  if (f.size > 10 * 1024 * 1024) { toast('الصورة أكبر من ١٠ ميجا، جرّب صورة أصغر'); e.target.value = ''; go.disabled = true; return; }
  let url = ''; try { url = URL.createObjectURL(f); } catch (err) {}
  box.innerHTML = (url ? `<img src="${url}" alt="معاينة الروشتة">` : ic('file')) + `<small>${f.name.replace(/[<>&"]/g, '')}</small><small>اضغط لتغيير الصورة</small>`;
  go.disabled = false;
});

$('#q').addEventListener('input', e => {
  state.q = e.target.value; $('#qclr').hidden = !state.q; renderGrid();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

$('#app').addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = Number(t.dataset.id);
  if (a === 'backdrop') { if (e.target === t) closeSheet(); return; }
  switch (a) {
    case 'tab': go(t.dataset.tab); break;
    case 'bell': toast('مفيش إشعارات جديدة'); break;
    case 'clear': $('#q').value = ''; state.q = ''; t.hidden = true; renderGrid(); $('#q').focus(); break;
    case 'cat': setCat(t.dataset.id, !!t.dataset.jump); break;
    case 'offer': {
      const [k, v] = t.dataset.go.split(':');
      if (k === 'cat') setCat(v, true); else go(v);
      break;
    }
    case 'open': openProduct(id); break;
    case 'add': {
      const p = byId[id];
      if (p.rx && !state.rxOk.includes(id)) { openRx(id); break; }
      setQty(id, 1); toast('أضفنا ' + p.n + ' للسلة'); break;
    }
    case 'inc': setQty(id, (state.cart[id] || 0) + 1); break;
    case 'dec': setQty(id, (state.cart[id] || 0) - 1); break;
    case 'del': setQty(id, 0); toast('شلنا ' + byId[id].n + ' من السلة'); break;
    case 'fav': {
      const i = state.favs.indexOf(id);
      if (i >= 0) state.favs.splice(i, 1); else state.favs.push(id);
      save();
      document.querySelectorAll(`.fav[data-id="${id}"]`).forEach(b => b.setAttribute('aria-pressed', isFav(id)));
      if (state.tab === 'me') renderMe();
      break;
    }
    case 'sinc': sheetQty = Math.min(10, sheetQty + 1); updateSheetQty(); break;
    case 'sdec': sheetQty = Math.max(1, sheetQty - 1); updateSheetQty(); break;
    case 'sadd': {
      setQty(sheetId, sheetQty); toast('السلة اتحدّثت'); closeSheet(); break;
    }
    case 'rx': openRx(id || null); break;
    case 'rxsend': {
      if (rxFor) {
        if (!state.rxOk.includes(rxFor)) state.rxOk.push(rxFor);
        setQty(rxFor, state.cart[rxFor] || 1);
        toast('بعتنا الروشتة وأضفنا الدواء للسلة'); closeSheet();
      } else {
        openSheet(`<div class="grab"></div>${closeBtn}<div class="done"><span class="ok">${ic('check')}</span>
          <h2>وصلت الروشتة</h2><p class="muted">الصيدلي هيراجعها ويكلّمك خلال ١٠ دقايق لتأكيد الأدوية والسعر.</p>
          <button class="cta solo" style="margin-top:14px" data-act="close">تمام</button></div>`);
      }
      break;
    }
    case 'close': closeSheet(); break;
    case 'pay': state.pay = t.dataset.v; renderCart(); break;
    case 'reorder': {
      const o = state.orders.find(x => x.no === t.dataset.no); if (!o) break;
      o.items.forEach(([pid, q]) => { state.cart[pid] = Math.min(10, (state.cart[pid] || 0) + q); });
      save(); refresh(); go('cart'); toast('رجّعنا الطلب في السلة'); break;
    }
    case 'checkout': {
      const sub = subtotal(); if (!sub) break;
      const order = {
        no: 'AS-' + (4800 + Math.floor(Math.random() * 190)),
        date: new Date().toLocaleDateString('ar-EG', { day: 'numeric', month: 'long' }),
        items: Object.entries(state.cart).map(([pid, q]) => [Number(pid), q])
      };
      const earned = Math.floor(sub / 10);
      state.orders.unshift(order); state.pts += earned; state.cart = {};
      save(); refresh();
      openSheet(`<div class="grab"></div>${closeBtn}<div class="done"><span class="ok">${ic('check')}</span>
        <h2>تم استلام طلبك</h2><span class="chip">طلب ${order.no}</span>
        <p class="muted">الصيدلي بيجهّزه دلوقتي، والتوصيل خلال ٣٠ دقيقة تقريباً.<br>كسبت ${fmt(earned)} نقطة.</p>
        <button class="cta solo" style="margin-top:14px" data-act="done">تمام</button></div>`);
      break;
    }
    case 'done': closeSheet(); go('home'); break;
    case 'theme': {
      const next = isDark() ? 'light' : 'dark';
      document.documentElement.dataset.theme = next; store.set('theme', next); renderMe(); break;
    }
    case 'help': toast('الصيدلي هيتواصل معاك على رقمك المسجّل'); break;
  }
});

/* ---------- boot ---------- */
const savedTheme = store.get('theme', null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
// drop cart entries for unknown ids
Object.keys(state.cart).forEach(k => { if (!byId[k]) delete state.cart[k]; });
renderStatic(); renderCats(); renderGrid(); renderBadge();
})();
</script>
</body>
</html>
